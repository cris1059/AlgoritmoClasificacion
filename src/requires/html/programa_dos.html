<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../css/style_index.css">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/style_puno.css">
    <script src="../../../node_modules/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <title>Programa dos</title>
</head>
<body>
    <!--AQUI SE SELECCION CARGA EL ARCHIVO-->
    <div class="window load_file">
        <label class="boton" for="fileInput">Cargar el Archivo</label>
        <input class="desactive" type="file" id="fileInput" />
        <button id="clear" class="boton generate">Limpiar</button>
        <button class="generate boton" id="generate">Cargar</button>
    </div>

    <!--SE MUESTRA LAS SELECCIONES DE ARCHIVOS-->
    <div class="window load load_file col">
        <label for="">Selecciona la muestra a analizar</label>
        <div class="selec" id="options_campo">
            <select class="input_select" name="" id="options_campo_file">
                <option value="-1">Selecciona</option>
            </select>
        </div>

        <div class="selec rigth" id="options_x">
            <label for="">X =</label>
            <select class="input_select" name="" id="optionX">
                <option value="-1">Seleccion</option>
            </select>
            <label for="">Y =</label>
            <select class="input_select" name="" id="optionY">
                <option value="-1">Seleccion</option>
            </select>
            
        </div>
        <div class="contentBoton">
            <button class="generate boton calculate" id="calculate_cruce">Calcular</button>
        </div>
    </div>

    <!--AQUI SE IMPRIMEN LOS RESULTADOS DADOS-->
    <div class="window load col" id="resultados">
    </div>



    
    <script src="../../js/tools-script.js"></script>
    <script src="../../js/script_programa_dos.js"></script>
</body>
</html>
